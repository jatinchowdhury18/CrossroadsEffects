notifications:
  email: false

language: python

jobs:
  include:
    - name: "Linux"
      python: 3.6

    - name: "Mac"
      os: osx
      osx_image: xcode11.2
      language: shell

    - name: "Windows"
      os: windows
      language: shell
      before_install:
        - choco install python --version 3.6.0
        - python -m pip install --upgrade pip
      env: PATH=/c/Python36:/c/Python36/Scripts:$PATH

install:
  - pip3 install --upgrade pip
  - pip install -r requirements.txt
  - pip install audio_dspy

script:
  - if [[ $TRAVIS_OS_NAME == 'linux' ]];
    then bash run_tests.sh;
    else sh run_tests.sh;
    fi
